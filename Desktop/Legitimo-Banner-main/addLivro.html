<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Livro</title>
</head>
<body>
    <main class="addLivro-main">
        <section class="addLivro-main-header">
            <img src="./imagens/addEmblema.png" class="addLivro-main-header-img"/>
            <div class="addLivro-main-header-texts">
                <h1 class="addLivro-main-header-title">Adicionar Livro</h1>
                <h3 class="addLivro-main-header-subtitle">Preencha as informações para adicionar um novo item ao catálogo</h3>
            </div>
        </section>
        <section class="addLivro-main-form">
            <div class="addLivro-main-form-col">
                <div class="addLivro-main-form-col-part">
                    <div class="addLivro-main-form-col-part-title">
                        <img src="" class="addLivro-main-form-col-part-title-icon"/>
                        <h2 class="addLivro-main-form-col-part-title-text">Informações básicas</h2>
                    </div>
                    <div class="input-div-type-1">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">Nome do Livro</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-1">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-1-block-insert" placeholder="Ex:Memórias Póstumas de Brás Cubas"/>
                        </div>
                    </div>
                    <div class="input-div-type-1">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">Tipo de Livro</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-1">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-2-block-insert" placeholder="Selecione o tipo"/>
                            <img src="./imagens/expand_icon.png" class="input-div-type-2-block-expand"/>
                        </div>
                    </div>
                    <div class="input-div-type-1">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">Nome do Autor</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-1">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-1-block-insert" placeholder="Ex:Machado de Assis"/>
                        </div>
                    </div>
                    <div class="input-div-type-1">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">Nome da Editora</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-1">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-1-block-insert" placeholder="Ex:Companhia das Letras"/>
                        </div>
                    </div>
                    <div class="input-doiuble-line">
                        <div class="input-div-type-2">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">Tamanho do Livro</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-2">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-1-block-insert" placeholder="Ex:14x21 cm"/>
                        </div>
                        </div>
                        <div class="input-div-type-2">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">Capacidade do estoque</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-2">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-1-block-insert" placeholder="Ex: 40"/>
                        </div>
                        </div>
                    </div>
                    <div class="input-div-type-1">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">ISBN</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-1">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-1-block-insert" placeholder="XX-XX-XXXX-XXX-X"/>
                        </div>
                    </div>
                    <div class="input-div-type-1">
                        <div class="input-div-type-1-texts">
                            <label class="label-div-type-1">Código de Barras(EAN/ISBN)</label>
                            <span class="obligate-div-type-1">*</span>
                            <span class="message-div-type-1">Teste de erro</span>
                        </div>
                        <div class="input-div-type-1-block">
                            <input type="text" class="input-div-type-1-block-insert" placeholder="Insira o código de 13 dígitos"/>
                        </div>
                    </div>
                    <div class="col-part-divisor"></div>
                </div>
                <div class="addLivro-main-form-col-part">
                    <div class="addLivro-main-form-col-part-title">
                        <img src="./imagens/filters_icon.png" class="addLivro-main-form-col-part-title-icon"/>
                        <h2 class="addLivro-main-form-col-part-title-text">Classificações</h2>
                    </div>
                    
                    
                    <div class="col-part-divisor"></div>
                </div>
                </div>
            </div>
            <div class="addLivro-main-form-col">

            </div>
        </section>
    </main>
    
</body>
</html>
